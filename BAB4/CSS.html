<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Selector Elemen - semua tag <h2> */
        h2 {
            color: #2E86C1;
            border-bottom: 2px solid #AED6F1;
        }

        /* Selector Class - elemen yang punya clas='highlight' */
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        /*Selector ID - elemen dengan ID='hero' */
        #hero {
            background-color: #1A5276;
            color: white;
            padding: 40px;
        }

        /* Grouping - terapkan gaya yang sama ke h1, h2, h3 */
        h1, h2, h3 {
            font-family: 'Georgia', serif;
            color: #1A5276;
        }

        /* Pseudo-Class - tautan saat di-hover */
        a:hover {
            color: red;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>SELAMAT DATANG</h1>
    <h1>REKAYASA PERANGKAT LUNAK</h1>

    <a href="#">X RPL 2</a>

    <p class="highlight">Andi Sukirno</p>

    <p id="hero">Bayu Kusuma</p>
</body>
</html>
